name: fluxoia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fluxoia}
      POSTGRES_USER: ${POSTGRES_USER:-fluxoia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o banco do LiteLLM na primeira inicialização do volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina DJANGO_SECRET_KEY no arquivo .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB:-fluxoia}
      POSTGRES_USER: ${POSTGRES_USER:-fluxoia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      # O backend acessa os modelos só pelo LiteLLM, na rede interna.
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_MODEL: fluxoia-geracao
      # Virtual key gerada no LiteLLM (veja o README).
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_PROVIDER: openai_compatible
    depends_on:
      db:
        condition: service_healthy

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.106.7
    restart: unless-stopped
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Defina LITELLM_MASTER_KEY no arquivo .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Defina LITELLM_SALT_KEY no arquivo .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fluxoia}:${POSTGRES_PASSWORD}@db:5432/litellm
      # Permite gerenciar modelos e configurações pela UI, persistindo no banco.
      STORE_MODEL_IN_DB: 'True'
      LLM_UPSTREAM_BASE_URL: ${LLM_UPSTREAM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_UPSTREAM_API_KEY: ${LLM_UPSTREAM_API_KEY:-ollama}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      # Só na própria máquina, para a UI (/ui). Na VPS, acesse por túnel SSH.
      - '127.0.0.1:${LITELLM_UI_PORT:-4000}:4000'
    extra_hosts:
      # Permite que o container alcance um Ollama rodando no host (Linux/VPS).
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
    depends_on:
      - backend

volumes:
  pgdata:
